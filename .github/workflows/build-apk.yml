name: Build Android APK (Flutter & Capacitor)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-flutter-apk:
    name: Build Native Flutter Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Install Flutter Dependencies
        working-directory: ./flutter-mobile
        run: flutter create . --platforms=android,ios && flutter pub get
      - name: Build Release APK
        working-directory: ./flutter-mobile
        run: flutter build apk --release
      - name: Upload AuraMusic Lossless APK
        uses: actions/upload-artifact@v4
        with:
          name: AuraMusic-Lossless-Android-APK
          path: flutter-mobile/build/app/outputs/flutter-apk/app-release.apk
