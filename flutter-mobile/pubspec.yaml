name: aura_music_lossless
description: Dual-Mode Spotify & YouTube Music Player with local audio playback and Spotify Wrapped Sync Bridge.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.38
  audio_service: ^0.18.13
  youtube_explode_dart: ^2.2.1
  http: ^1.2.1
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
